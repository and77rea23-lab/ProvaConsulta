<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Staff Monitor - Aeroporto di Firenze (FLR)</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Arial Narrow', Arial, sans-serif; }
    body { background-color: #ffffff; color: #000000; padding: 5px; font-size: 11px; }

    .filter-bar {
      display: flex;
      align-items: center;
      gap: 15px;
      padding: 6px 10px;
      background-color: #ffffff;
      font-size: 11px;
      color: #333333;
      border-bottom: 1px solid #cccccc;
      margin-bottom: 5px;
    }
    .filter-bar label { display: flex; align-items: center; gap: 4px; cursor: pointer; }
    .clock-display { margin-left: auto; font-weight: bold; font-size: 12px; color: #0b3370; }

    .table-container { width: 100%; overflow-x: auto; margin-bottom: 8px; }
    table { width: 100%; border-collapse: collapse; white-space: nowrap; }

    /* Intestazione Blu dello Staff Monitor */
    .header-blue { background-color: #0b3370; color: #ffffff; }
    .header-blue th {
      padding: 4px 6px;
      font-size: 10px;
      font-weight: bold;
      text-transform: uppercase;
      text-align: left;
      border-right: 1px solid #1a4380;
    }
    .header-blue th.title-cell { font-size: 11px; letter-spacing: 0.5px; width: 100px; }

    /* Tabella Partenze (Sfondo Nero / Testo Bianco) */
    .table-departures { background-color: #000000; color: #ffffff; }
    .table-departures tr.data-row { border-bottom: 1px solid #222222; height: 30px; }
    .table-departures td { padding: 2px 6px; vertical-align: middle; font-size: 11px; font-weight: bold; }

    /* Tabella Arrivi (Sfondo Grigio Scuro / Testo Giallo) */
    .table-arrivals { background-color: #3f4347; color: #ffee00; }
    .table-arrivals tr.data-row { border-bottom: 1px solid #52575c; height: 30px; }
    .table-arrivals td { padding: 2px 6px; vertical-align: middle; font-size: 11px; font-weight: bold; color: #ffee00; }

    .col-flight { width: 80px; color: #ffffff; }
    .table-arrivals .col-flight { color: #ffee00; }
    .col-actype { width: 50px; }
    .col-trtype { width: 50px; color: #aaaaaa; }
    .col-reg { width: 65px; color: #ffffff; }
    .table-arrivals .col-reg { color: #ffee00; }
    .col-city { font-size: 11px; font-weight: bold; width: 150px; }

    .box-time { display: inline-block; padding: 1px 4px; border-radius: 2px; font-size: 11px; font-weight: bold; text-align: center; min-width: 38px; }
    .box-sched { background-color: #1a1a1a; color: #ffcc00; }
    .box-exp { background-color: #1a1a1a; color: #ffffff; }
    .table-arrivals .box-exp { color: #ffee00; }
  </style>
</head>
<body>

  <div class="filter-bar">
    <label><input type="radio" name="viewMode" value="window" checked onclick="renderTables()"> Ora Corrente (Finestra Attuale)</label>
    <label><input type="radio" name="viewMode" value="all" onclick="renderTables()"> Programmazione Completa Giornaliera</label>
    <div class="clock-display" id="live-clock">--:--:--</div>
  </div>

  <!-- SEZIONE PARTENZE -->
  <div class="table-container">
    <table class="table-departures">
      <thead>
        <tr class="header-blue">
          <th class="title-cell">DEPARTURES</th>
          <th>VOLO / FLIGHT</th>
          <th>AC TYPE</th>
          <th>TR.TYPE</th>
          <th>REG</th>
          <th>DEST / TO</th>
          <th>SLOT</th>
          <th>SCHED</th>
          <th>EXP</th>
          <th>BLKOFF</th>
          <th>TKOFF</th>
          <th>STATUS</th>
          <th>STAND</th>
          <th>CHECKIN</th>
          <th>GATE</th>
          <th>NOTA OPERATORE</th>
        </tr>
      </thead>
      <tbody id="departures-rows"></tbody>
    </table>
  </div>

          <th>LAND</th>
          <th>BLKON</th>

    function timeToMin(tStr) {
      const parts = tStr.split(':');
      return parseInt(parts[0], 10) * 60 + parseInt(parts[1], 10);
    }

    function updateClock() {
      const now = new Date();
      document.getElementById('live-clock').textContent = "ORA LOCALE: " + now.toLocaleTimeString('it-IT');
      renderTables();
    }

    function renderTables() {
      const now = new Date();
      const currentMin = now.getHours() * 60 + now.getMinutes();
      const mode = document.querySelector('input[name="viewMode"]:checked').value;

      // Filtro Partenze
      let filteredDeps = FLR_DEPARTURES;
      if (mode === 'window') {
        filteredDeps = FLR_DEPARTURES.filter(item => {
          let m = timeToMin(item.sched);
          return m >= (currentMin - 60) && m <= (currentMin + 180);
        });
        if (filteredDeps.length === 0) filteredDeps = FLR_DEPARTURES.slice(-8);
      }

      let depHtml = filteredDeps.map(item => {
        let schedM = timeToMin(item.sched);
        let status = "SCHEDULED";
        let blkoff = "";
        
        if (schedM < currentMin - 15) {
          status = "DEPARTED";
          blkoff = item.sched;
        } else if (schedM <= currentMin + 30) {
          status = "BOARDING";
        }

        return `
          <tr class="data-row">
            <td class="col-flight">${item.flight}</td>
            <td class="col-actype">${item.ac}</td>
            <td class="col-trtype">Linea</td>
            <td class="col-reg">${item.reg}</td>
            <td class="col-city">${item.dest}</td>
            <td></td>
            <td><span class="box-time box-sched">${item.sched}</span></td>
            <td><span class="box-time box-exp">${item.sched}</span></td>
            <td>${blkoff}</td>
            <td></td>
            <td>${status}</td>
            <td>${item.stand}</td>
            <td></td>
            <td>${item.gate}</td>
            <td></td>
          </tr>
        `;
      }).join('');
      document.getElementById('departures-rows').innerHTML = depHtml;

      // Filtro Arrivi
      let filteredArrs = FLR_ARRIVALS;
      if (mode === 'window') {
        filteredArrs = FLR_ARRIVALS.filter(item => {
          let m = timeToMin(item.sched);
          return m >= (currentMin - 60) && m <= (currentMin + 180);
        });
        if (filteredArrs.length === 0) filteredArrs = FLR_ARRIVALS.slice(-8);
      }

      let arrHtml = filteredArrs.map(item => {
        let schedM = timeToMin(item.sched);
        let status = "ESTIMATED";
        let landTime = "";

        if (schedM <= currentMin) {
          status = "LANDED";
          landTime = item.sched;
        }

        return `
          <tr class="data-row">
            <td class="col-flight">${item.flight}</td>
            <td class="col-actype">${item.ac}</td>
            <td class="col-trtype">Linea</td>
            <td class="col-reg">${item.reg}</td>
            <td class="col-city">${item.origin}</td>
            <td><span class="box-time box-sched">${item.sched}</span></td>
            <td><span class="box-time box-exp">${item.sched}</span></td>
            <td>${landTime}</td>
            <td></td>
            <td>${status}</td>
            <td>${item.stand}</td>
            <td>${item.belt}</td>
            <td></td>
          </tr>
        `;
      }).join('');
      document.getElementById('arrivals-rows').innerHTML = arrHtml;
    }
